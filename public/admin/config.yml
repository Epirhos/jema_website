# Administration du site Jema (Sveltia CMS) — https://<domaine>/admin
#
# Connexion : « Se connecter avec un jeton d'accès » GitHub (fine-grained token,
# droit Contents: Read and write sur ce dépôt). Le bouton « Se connecter avec
# GitHub » demandera plus tard un petit relais OAuth gratuit sur Cloudflare
# (sveltia-cms-auth) : renseigner alors `base_url`.
backend:
  name: github
  repo: flowvx/jema_website
  # Branche de test. Passer à `main` au lancement : chaque publication y sera
  # mise en ligne automatiquement.
  branch: bulle
  # base_url: https://sveltia-cms-auth.<compte>.workers.dev

locale: fr
site_url: https://jema.app
display_url: https://jema.app
logo_url: /favicon.svg

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  # ───────────── Nouveautés (une entrée par version) ─────────────
  - name: versions
    label: Nouveautés
    label_singular: Version
    description: Une entrée par version publiée. Écrivez du côté de l'auteur, une ligne par changement, le plus important en premier.
    folder: src/content/versions
    create: true
    identifier_field: version
    slug: "{{version}}"
    summary: "v{{version}} · {{titre}}"
    sortable_fields: [date, version]
    fields:
      - { name: version, label: "Numéro de version", widget: string, hint: "Exemple : 4.1.0 (sans le v)" }
      - { name: date, label: "Date de publication", widget: datetime, time_format: false, date_format: "DD/MM/YYYY", format: "YYYY-MM-DD" }
      - { name: canal, label: "Canal", widget: select, options: ["bêta", "stable"], default: "bêta" }
      - { name: titre, label: "Titre-promesse", widget: string, hint: "Une phrase. Exemple : Jema se souvient de vos chronologies" }
      - { name: resume, label: "Résumé", widget: text, hint: "Deux lignes : ce qui change pour l'auteur." }
      - { name: brouillon, label: "Brouillon (non publié)", widget: boolean, default: false, required: false }
      - name: body
        label: Notes de version
        widget: markdown
        hint: "Gardez les rubriques ; supprimez celles qui sont vides."
        default: |
          ## Nouveau

          -

          ## Amélioré

          -

          ## Corrigé

          -

          ## Sécurité

          -

          ## À savoir

          -

  # ───────────── Journal (annonces, coulisses, conseils) ─────────────
  - name: journal
    label: Journal
    label_singular: Article
    folder: src/content/journal
    create: true
    identifier_field: titre
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date | date('DD/MM/YYYY')}} · {{titre}}"
    sortable_fields: [date, titre]
    fields:
      - { name: titre, label: "Titre", widget: string }
      - { name: date, label: "Date", widget: datetime, time_format: false, date_format: "DD/MM/YYYY", format: "YYYY-MM-DD" }
      - { name: categorie, label: "Catégorie", widget: select, options: ["Annonce", "Coulisses", "Conseil", "Version"], default: "Annonce" }
      - { name: resume, label: "Résumé", widget: text, hint: "Affiché dans la liste du journal et dans les aperçus de partage." }
      - { name: brouillon, label: "Brouillon (non publié)", widget: boolean, default: false, required: false }
      - { name: body, label: "Texte", widget: markdown }

  # ───────────── Pages (Bêta, FAQ, légal) ─────────────
  - name: pages
    label: Pages
    label_singular: Page
    description: "Pages « info » : adresse /nom-du-fichier. Pages « légal » : /legal/nom-du-fichier."
    folder: src/content/pages
    create: true
    identifier_field: title
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Titre", widget: string }
      - { name: description, label: "Description (moteurs de recherche)", widget: text, required: false }
      - { name: section, label: "Type", widget: select, options: [{ label: "Information", value: "info" }, { label: "Légal", value: "legal" }], default: "info" }
      - { name: updated, label: "Dernière mise à jour", widget: datetime, time_format: false, date_format: "DD/MM/YYYY", format: "YYYY-MM-DD" }
      - { name: body, label: "Contenu", widget: markdown }

  # ───────────── Réglages du site ─────────────
  - name: reglages
    label: Réglages du site
    files:
      - name: site
        label: Réglages généraux
        file: src/data/site.json
        fields:
          - name: banner
            label: Bandeau d'annonce (en haut de toutes les pages)
            widget: object
            fields:
              - { name: enabled, label: "Afficher le bandeau", widget: boolean, default: false }
              - { name: text, label: "Texte", widget: string, required: false }
              - { name: linkLabel, label: "Texte du lien", widget: string, required: false }
              - { name: link, label: "Lien (ex. /nouveautes/4-1-0)", widget: string, required: false }
          - name: beta
            label: Bêta
            widget: object
            fields:
              - { name: active, label: "Bêta en cours", widget: boolean }
              - { name: label, label: "Pastille", widget: string }
              - { name: start, label: "Début", widget: string }
              - { name: end, label: "Fin", widget: string }
          - { name: fallbackVersion, label: "Version de secours (si GitHub ne répond pas)", widget: string, hint: "Exemple : v4.0.0" }
          - { name: releasesRepo, label: "Dépôt GitHub des versions", widget: string }
          - { name: contactEmail, label: "E-mail de contact", widget: string }
          - { name: siteUrl, label: "Adresse du site", widget: string }
          - name: requirements
            label: Configuration requise
            widget: object
            fields:
              - { name: ram, label: "Mémoire (phrase complète)", widget: string }
              - { name: ramShort, label: "Mémoire (version courte)", widget: string }
              - { name: os, label: "Systèmes", widget: string }
          - name: analytics
            label: Mesure d'audience (Umami)
            widget: object
            fields:
              - { name: umamiWebsiteId, label: "Identifiant du site Umami", widget: string, required: false, hint: "Vide = mesure désactivée." }
              - { name: umamiSrc, label: "Adresse du script Umami", widget: string }
