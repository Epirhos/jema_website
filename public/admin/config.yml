# Administration du site Jema (Sveltia CMS) : https://jema.software/admin
# Mode d'emploi pour l'éditeur : bouton « Mode d'emploi » dans l'admin (public/admin/aide/).
# Mode d'emploi technique : docs/manuel (PDF).
#
# Connexion : « Se connecter avec un jeton d'accès » GitHub (fine-grained token,
# droit Contents: Read and write sur ce dépôt). Le bouton « Se connecter avec
# GitHub » demandera plus tard un petit relais OAuth gratuit sur Cloudflare
# (sveltia-cms-auth) : renseigner alors `base_url`.
backend:
  name: github
  repo: Epirhos/jema_website
  # Production : chaque publication est mise en ligne sur jema.software en 1 à 2 min
  # (Cloudflare Pages construit `main`). Pour tester sans risque, mettre `bulle`
  # puis revenir à `main` (voir le manuel, chapitre « Branches »).
  branch: main
  commit_messages:
    create: "contenu : ajoute {{collection}} « {{slug}} »"
    update: "contenu : modifie {{collection}} « {{slug}} »"
    delete: "contenu : supprime {{collection}} « {{slug}} »"
    uploadMedia: "contenu : ajoute l'image {{path}}"
    deleteMedia: "contenu : supprime l'image {{path}}"
  # base_url: https://sveltia-cms-auth.<compte>.workers.dev

locale: fr
app_title: Jema · Administration du site
site_url: https://jema.software
display_url: https://jema.software
logo:
  src: /favicon.svg

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  # ───────────── Téléchargements (interrupteur) ─────────────
  - name: telechargements
    label: Téléchargements
    icon: download
    description: Ouvrir ou mettre en pause les téléchargements de Jema. Le site reste en ligne.
    files:
      - name: telechargements
        label: Ouvrir ou mettre en pause
        file: src/data/downloads.json
        editor: { preview: false }
        fields:
          - name: open
            label: Téléchargements ouverts
            widget: boolean
            default: true
            hint: "Activé : tout le monde peut télécharger Jema. Désactivé : les boutons sont remplacés par le message ci-dessous et un lien « Me prévenir », y compris pour les liens déjà partagés ailleurs. Visible sur le site environ 1 minute après « Enregistrer »."
          - name: title
            label: Titre affiché pendant la pause
            widget: string
            default: "Les téléchargements reprennent bientôt."
          - name: reason
            label: Pourquoi ? (vu par les visiteurs)
            widget: text
            required: false
            hint: "Une ou deux phrases, du point de vue du visiteur. Exemple : Nous préparons la version 4.1 à partir de vos retours : elle corrige l'export et ajoute la relecture par chapitre."
          - name: until
            label: Reprise prévue le
            widget: datetime
            time_format: false
            date_format: "DD/MM/YYYY"
            format: "YYYY-MM-DD"
            required: false
            hint: "Laisser vide si la date n'est pas encore connue."

  - divider: true

  # ───────────── Nouveautés (une entrée par version) ─────────────
  - name: versions
    label: Nouveautés
    label_singular: Version
    icon: new_releases
    description: Une fiche par version publiée de Jema. Une ligne par changement, le plus important en premier.
    folder: src/content/versions
    create: true
    identifier_field: version
    slug: "{{version}}"
    summary: "v{{version}} · {{titre}}"
    sortable_fields: [date, version]
    fields:
      - { name: version, label: "Numéro de version", widget: string, pattern: ['^\d+\.\d+\.\d+$', "Format attendu : 4.1.0 (trois nombres, sans le v)"], hint: "Exemple : 4.1.0 (sans le v). Doit correspondre à la version publiée sur GitHub." }
      - { name: date, label: "Date de publication", widget: datetime, time_format: false, date_format: "DD/MM/YYYY", format: "YYYY-MM-DD" }
      - { name: canal, label: "Canal", widget: select, options: ["bêta", "stable"], default: "bêta" }
      - { name: titre, label: "Titre-promesse", widget: string, hint: "Une phrase, ce que l'auteur y gagne. Exemple : Jema se souvient de vos chronologies." }
      - { name: resume, label: "Résumé", widget: text, hint: "Deux lignes : ce qui change pour l'auteur. Affiché sur l'accueil et dans la liste des nouveautés." }
      - { name: brouillon, label: "Brouillon (non publié)", widget: boolean, default: false, required: false, hint: "Activé : la fiche est enregistrée mais n'apparaît pas sur le site." }
      - name: body
        label: Notes de version
        widget: markdown
        hint: "Gardez les rubriques, supprimez celles qui sont vides. Une ligne par changement, en commençant par ce que l'auteur peut faire."
        default: |
          ## Nouveau

          -

          ## Amélioré

          -

          ## Corrigé

          -

          ## Sécurité

          -

          ## À savoir

          -

  # ───────────── Journal (annonces, coulisses, conseils) ─────────────
  - name: journal
    label: Journal
    label_singular: Article
    icon: edit_note
    description: Annonces, coulisses et conseils d'écriture.
    folder: src/content/journal
    create: true
    identifier_field: titre
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date | date('DD/MM/YYYY')}} · {{titre}}"
    sortable_fields: [date, titre]
    fields:
      - { name: titre, label: "Titre", widget: string }
      - { name: date, label: "Date", widget: datetime, time_format: false, date_format: "DD/MM/YYYY", format: "YYYY-MM-DD" }
      - { name: categorie, label: "Catégorie", widget: select, options: ["Annonce", "Coulisses", "Conseil", "Version"], default: "Annonce" }
      - { name: resume, label: "Résumé", widget: text, hint: "Une ou deux phrases. Affiché dans la liste du journal et dans les aperçus de partage (réseaux sociaux)." }
      - { name: brouillon, label: "Brouillon (non publié)", widget: boolean, default: false, required: false, hint: "Activé : l'article est enregistré mais n'apparaît pas sur le site." }
      - { name: body, label: "Texte", widget: markdown }

  # ───────────── Pages (Bêta, FAQ, légal) ─────────────
  - name: pages
    label: Pages
    label_singular: Page
    icon: description
    description: "Pages d'information (adresse /nom-du-fichier) et pages légales (/legal/nom-du-fichier)."
    folder: src/content/pages
    create: true
    identifier_field: title
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Titre", widget: string }
      - { name: description, label: "Description (moteurs de recherche)", widget: text, required: false, hint: "Une phrase qui résume la page, affichée par Google sous le titre." }
      - { name: section, label: "Type", widget: select, options: [{ label: "Information", value: "info" }, { label: "Légal", value: "legal" }], default: "info" }
      - { name: updated, label: "Dernière mise à jour", widget: datetime, time_format: false, date_format: "DD/MM/YYYY", format: "YYYY-MM-DD", hint: "Pensez à la changer à chaque modification d'une page légale." }
      - { name: body, label: "Contenu", widget: markdown }

  - divider: true

  # ───────────── Bandeau d'annonce ─────────────
  - name: bandeau
    label: Bandeau
    icon: campaign
    description: Une ligne en haut de toutes les pages. Pendant une pause des téléchargements, le bandeau l'annonce de lui-même.
    files:
      - name: bandeau
        label: Modifier le bandeau
        file: src/data/banner.json
        editor: { preview: false }
        fields:
          - { name: enabled, label: "Afficher le bandeau", widget: boolean, default: false }
          - { name: text, label: "Texte", widget: string, required: false, hint: "Court : une ligne sur ordinateur. Exemple : La version 4.1 est disponible." }
          - { name: linkLabel, label: "Texte du lien", widget: string, required: false, hint: "Exemple : Voir les nouveautés" }
          - { name: link, label: "Lien", widget: string, required: false, hint: "Adresse d'une page du site, par exemple /nouveautes/4-1-0 ou /journal" }

  # ───────────── Réglages du site ─────────────
  - name: reglages
    label: Réglages du site
    icon: tune
    description: Bêta, contact, configuration requise, version de secours et mesure d'audience. À modifier rarement.
    files:
      - name: reglages
        label: Modifier les réglages
        file: src/data/site.json
        editor: { preview: false }
        fields:
          - name: beta
            label: Bêta
            widget: object
            fields:
              - { name: active, label: "Bêta en cours", widget: boolean }
              - { name: label, label: "Pastille", widget: string }
              - { name: start, label: "Début (AAAA-MM-JJ)", widget: string }
              - { name: end, label: "Fin (AAAA-MM-JJ)", widget: string }
          - { name: contactEmail, label: "E-mail de contact", widget: string, readonly: true, hint: "Verrouillé par sécurité : modifiable seulement dans le code (scripts/garde.mjs), pour qu'un accès volé à l'admin ne puisse pas détourner les messages des visiteurs." }
          - name: requirements
            label: Configuration requise
            widget: object
            fields:
              - { name: ram, label: "Mémoire (phrase complète)", widget: string }
              - { name: ramShort, label: "Mémoire (version courte)", widget: string }
              - { name: os, label: "Systèmes", widget: string }
          - { name: fallbackVersion, label: "Version de secours", widget: string, hint: "Utilisée seulement si GitHub ne répond pas. Exemple : v4.0.0. À mettre à jour à chaque nouvelle version." }
          - { name: releasesRepo, label: "Dépôt GitHub des versions", widget: string, readonly: true, hint: "Verrouillé par sécurité : les téléchargements ne peuvent venir que de ce dépôt." }
          - { name: siteUrl, label: "Adresse du site", widget: string, readonly: true, hint: "Verrouillé par sécurité." }
          - name: analytics
            label: Mesure d'audience (Umami)
            widget: object
            collapsed: true
            fields:
              - { name: umamiWebsiteId, label: "Identifiant du site Umami", widget: string, required: false, hint: "Vide = mesure désactivée." }
              - { name: umamiSrc, label: "Adresse du script Umami", widget: string, readonly: true, hint: "Verrouillé par sécurité : seul le script officiel d'Umami est autorisé." }
